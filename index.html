<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZYROX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#0d0d0d',
                        surfaceDark: '#1a1a1a',
                        surfaceBorder: '#2e2e2e',
                        accentGreen: '#4ade80',
                        textPrimary: '#e5e5e5',
                        textMuted: '#737373',
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'monospace'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d0d0d;
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .sharp-card {
            background-color: #1a1a1a;
            border: 1px solid #2e2e2e;
            border-radius: 0px;
        }
        .sharp-card:hover {
            border-color: #4ade80;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0d0d0d;
        }
        ::-webkit-scrollbar-thumb {
            background: #2e2e2e;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4ade80;
        }
    </style>
</head>
<body class="bg-[#0d0d0d] text-[#e5e5e5] min-h-screen flex flex-col justify-between selection:bg-[#4ade80] selection:text-[#0d0d0d]">

    <header class="sticky top-0 z-50 bg-[#0d0d0d] border-b border-[#2e2e2e]">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-xl font-mono font-bold tracking-tighter text-[#4ade80] bg-[#1a1a1a] px-2 py-1 border border-[#2e2e2e]">ZYROX</span>
                <span class="text-xs font-mono text-[#737373]">Alpha Page</span>
            </div>

            <nav class="hidden md:flex items-center gap-8 font-mono text-xs uppercase tracking-wider text-[#737373]">
            </nav>

            <div class="flex items-center gap-3">
    
            </div>
        </div>
    </header>

    <section class="pt-16 pb-24 px-6 border-b border-[#2e2e2e]">
        <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
            
            <div class="lg:col-span-7 space-y-6">
                <div class="inline-flex items-center gap-2 px-2.5 py-1 bg-[#1a1a1a] border border-[#2e2e2e] text-xs font-mono text-[#4ade80]">
                    <span>-</span> Launcher
                </div>

                <h1 class="text-5xl sm:text-6xl lg:text-7xl font-mono font-bold uppercase tracking-tight text-[#e5e5e5]">
                    ZYROX
                </h1>

                <p class="text-lg font-mono text-[#737373] max-w-xl leading-relaxed">
                    This is the launcher for Zyrox
                </p>

                <div class="flex flex-wrap items-center gap-4 pt-2">
                    <a href="download.html" class="px-6 py-3 bg-[#4ade80] text-[#0d0d0d] font-mono font-bold text-sm rounded-none hover:bg-[#22c55e] transition-colors flex items-center gap-2">
                        <span>Download</span>
                    </a>
                </div>
                </div>
            </div>
        </div>
    </section>

    <section id="changelog" class="py-24 px-6 border-b border-[#2e2e2e]">
        <div class="max-w-7xl mx-auto">
            <div class="mb-16">
                <span class="text-xs font-mono text-[#4ade80] bg-[#1a1a1a] px-2.5 py-1 border border-[#2e2e2e]">VERSION HISTORY</span>
                <h2 class="text-3xl sm:text-4xl font-mono font-bold uppercase tracking-tight text-[#e5e5e5] mt-4">Changelog</h2>
            </div>

            <div class="space-y-6">
                <div class="sharp-card p-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-4 mb-4 border-b border-[#2e2e2e] font-mono text-xs">
                        <span class="text-[#4ade80] font-bold">Closed Alpha</span>
                        <span class="text-[#737373]">SEPTEMBER 12, 2026</span>
                    </div>
                    <ul class="space-y-2 font-mono text-xs text-[#737373] list-disc list-inside">
                        <li>Join the discord to apply</li>
                        <li>Closed Alpha will only has a few features</li>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-[#0d0d0d] py-12 px-6 font-mono text-xs border-t border-[#2e2e2e]">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6 text-[#737373]">
            <div>
                <span class="text-[#e5e5e5] font-bold bg-[#1a1a1a] px-2 py-0.5 border border-[#2e2e2e] text-[#4ade80] mr-2">Zyrox :)</span> 
                
            </div>
            <div class="flex items-center gap-6">
                <a href="https://discord.com" target="_blank" rel="noopener noreferrer" class="hover:text-[#4ade80] transition-colors">Discord Soon</a>
                <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="hover:text-[#4ade80] transition-colors">GitHub Repository (soon)</a>
                <span class="text-[#e5e5e5]"></span>
            </div>
        </div>
    </footer>

    <script>
        function triggerDownload(packageName) {
            const notif = document.getElementById('download-notification');
            const msg = document.getElementById('download-msg');
            
            msg.textContent = `[SUCCESS] Secure stream initiated for ${packageName}. Check local downloads directory.`;
            notif.classList.remove('hidden');
            notif.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            setTimeout(() => {
                notif.classList.add('hidden');
            }, 6000);
        }
    </script>
</body>
</html>
