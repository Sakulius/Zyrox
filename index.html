<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZYROX</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#0a0a0a',
                        surfaceDark: '#111111',
                        surfaceBorder: '#262626',
                        accentOrange: '#dc772f',
                        textPrimary: '#ededed',
                        textMuted: '#737373'
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'monospace'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #ededed;
            font-family: 'Inter', sans-serif;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .sharp-card {
            background: #111111;
            border: 1px solid #262626;
            border-radius: 2px;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .sharp-card:hover {
            border-color: #3f3f3f;
            background: #141414;
        }

        .download-button {
            transition:
                background 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .download-button:hover {
            background: #c96624;
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(220, 119, 47, 0.12);
        }

        ::selection {
            background: #dc772f;
            color: #0a0a0a;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #292929;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #dc772f;
        }
    </style>
</head>

<body class="bg-[#0a0a0a] text-[#ededed] min-h-screen flex flex-col">

    <header class="sticky top-0 z-50 bg-[#0a0a0a]/95 backdrop-blur border-b border-[#262626]">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            
            <div class="flex items-center">
                <span class="w-1.5 h-1.5 bg-[#b82828] rounded-full mr-2"></span>

                <span class="text-[10px] font-mono uppercase tracking-widest text-[#555555]">
                    Offline
                </span>
            </div>

        </div>
    </header>


    <section class="relative pt-24 pb-24 px-6 border-b border-[#262626] overflow-hidden">

        <div class="relative max-w-7xl mx-auto">

            <div class="max-w-4xl">

                <h1 class="text-6xl sm:text-7xl lg:text-8xl font-mono font-bold uppercase tracking-[-0.06em] text-[#ededed] leading-none">
                    ZYROX
                </h1>

                <div class="flex items-center gap-4 pt-8">

                    <a
                        href="download.html"
                        class="download-button px-7 py-3.5 bg-[#dc772f] text-[#0a0a0a] font-mono font-bold text-sm rounded-none flex items-center gap-3"
                    >
                        <span>Download</span>
                        <span class="text-[#5a280f]">→</span>
                    </a>

                </div>

            </div>

        </div>
    </section>


    <section id="changelog" class="py-24 px-6 border-b border-[#262626]">

            <div class="mb-5">
                
                <h2 class="text-3xl sm:text-4xl font-mono font-bold uppercase tracking-tight text-[#ededed] mt-5">
                    Changelog
                </h2>

            </div>

            <div class="max-w-4xl">

                <div class="sharp-card p-6 sm:p-7">

                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 pb-5 mb-5 border-b border-[#262626]">

                        <span class="text-[#dc772f] font-mono text-xs font-bold uppercase tracking-wider">
                            Join the discord to join the closed beta
                        </span>

                        <span class="text-[#555555] font-mono text-[10px] uppercase tracking-widest">
                            September 12, 2026
                        </span>

                    </div>

                    <ul class="space-y-3 font-mono text-xs text-[#737373]">

                        <li class="flex gap-3">
                            <span class="text-[#dc772f]">+</span>

                            <span>
                                <a
                                    href="https://discord.gg/ZyroxBeta"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="hover:text-[#dc772f] transition-colors"
                                >
                                    Discord &lt;--
                                </a>
                            </span>
                        </li>

                    </ul>

                </div>

            </div>

        </div>
    </section>


    <footer class="bg-[#0a0a0a] py-10 px-6 font-mono text-xs">

        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6 text-[#555555]">

            <div class="flex items-center">

                <span class="text-[#dc772f] font-bold bg-[#111111] px-2 py-1 border border-[#262626] mr-3">
                    Zyrox By Saku ❤️
                </span>

            </div>

            <div class="flex items-center gap-4 flex-wrap justify-center">

                <a
                    href="https://discord.gg/ZyroxBeta"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="hover:text-[#dc772f] transition-colors"
                >
                    Discord
                </a>

                <!-- Got This from uiverse.io (https://uiverse.io/elijahgummer/bright-chicken-11)-->

                >

                    <span
                        class="absolute right-0 -mt-12 h-32 w-8 translate-x-12 rotate-12 bg-white opacity-10 transition-all duration-1000 ease-out group-hover:-translate-x-40"
                    ></span>

                        </svg>

                        <span class="ml-1 text-white">
                            Star on GitHub
                        </span>

                    </div>

                    <div class="ml-2 flex items-center gap-1 text-sm">

                        <svg
                            class="w-4 h-4 text-gray-500 transition-all duration-300 group-hover:text-yellow-300"
                            aria-hidden="true"
                            fill="currentColor"
                            viewBox="0 0 24 24"

                            <path

                            />
                        </svg>

                        <span class="inline-block tabular-nums tracking-wider font-medium text-white">
                            6
                        </span>

                    </div>

                </a>

            </div>

        </div>

    </footer>

</body>
</html>
